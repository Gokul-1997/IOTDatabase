<!-- ══════════ DESKTOP SIDEBAR ══════════ -->
<aside class="side-nav hidden lg:flex" [class.side-nav--min]="isCollapsed">

  <!-- Brand + collapse toggle -->
  <div class="side-nav__brand">
    <img *ngIf="!isCollapsed" src="/images/logo/dharstec_logo_white.svg" class="w-40" alt="Dharstec Solutions" />
    <img *ngIf="isCollapsed" src="/images/logo/dharstec_mark_white.svg" class="w-8 mx-auto" alt="Dharstec" />

    <button (click)="toggleCollapse()" class="side-nav__collapse"
            [title]="isCollapsed ? 'Expand menu' : 'Collapse menu'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"
           [class.rotate-180]="isCollapsed">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
  </div>

  <!-- Nav -->
  <nav class="side-nav__list">

    <ng-container *ngFor="let menu of menus">

      <!-- LEAF ITEM -->
      <button *ngIf="!menu.children"
              (click)="navigate(menu)"
              class="nav-btn"
              [class.active]="isActive(menu.path)"
              [title]="isCollapsed ? menu.label : ''">
        <app-icon [name]="menu.icon" [size]="20"></app-icon>
        <span *ngIf="!isCollapsed">{{ menu.label }}</span>
      </button>

      <!-- GROUP -->
      <div *ngIf="menu.children">
        <button (click)="toggleMenu(menu.label)"
                class="nav-btn"
                [class.justify-between]="!isCollapsed"
                [class.active]="isChildActive(menu.children)"
                [title]="isCollapsed ? menu.label : ''">
          <span class="flex items-center gap-3">
            <app-icon [name]="menu.icon || 'settings'" [size]="20"></app-icon>
            <span *ngIf="!isCollapsed">{{ menu.label }}</span>
          </span>
          <svg *ngIf="!isCollapsed" class="w-3 h-3 transition-transform shrink-0"
               [class.rotate-180]="openMenu === menu.label"
               viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
          </svg>
        </button>

        <div *ngIf="openMenu === menu.label && !isCollapsed" class="nav-sub">
          <button *ngFor="let child of menu.children"
                  (click)="navigate(child)"
                  class="nav-sub__item"
                  [class.active]="isActive(child.path)">
            {{ child.label }}
          </button>
        </div>
      </div>

    </ng-container>
  </nav>

  <!-- Footer: theme + user -->
  <div class="side-nav__foot">

    <button (click)="toggleTheme()" class="nav-btn" [title]="isCollapsed ? (isDark ? 'Light mode' : 'Dark mode') : ''">
      <app-icon [name]="isDark ? 'sun' : 'moon'" [size]="20"></app-icon>
      <span *ngIf="!isCollapsed">{{ isDark ? 'Light mode' : 'Dark mode' }}</span>
    </button>

    <div class="user-menu-wrap relative">
      <button (click)="toggleUserMenu()" class="side-nav__user" [title]="isCollapsed ? userName : ''">
        <div class="side-nav__avatar">{{ userName.charAt(0).toUpperCase() }}</div>
        <div *ngIf="!isCollapsed" class="text-left min-w-0 flex-1">
          <p class="text-sm font-medium text-white truncate leading-none">{{ userName }}</p>
          <p class="text-[11px] text-[#8E8CC7] truncate leading-none mt-1">{{ userRole }}</p>
        </div>
        <svg *ngIf="!isCollapsed" class="w-4 h-4 text-[#8E8CC7] transition-transform shrink-0"
             [class.rotate-180]="showUserMenu" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
        </svg>
      </button>

      <div *ngIf="showUserMenu" class="side-nav__pop">
        <div class="px-4 py-2.5" style="border-bottom:1px solid var(--cs-border)">
          <p class="text-sm font-semibold truncate" style="color:var(--cs-txt)">{{ userName }}</p>
          <p *ngIf="userEmail" class="text-xs truncate mt-0.5" style="color:var(--cs-txt-3)">{{ userEmail }}</p>
        </div>
        <button (click)="logout()"
                class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-500/10 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
          </svg>
          Sign Out
        </button>
      </div>
    </div>
  </div>
</aside>

<!-- ══════════ MOBILE TOP BAR ══════════ -->
<header class="lg:hidden sticky top-0 w-full z-50" style="background: var(--cs-nav)">
  <div class="flex items-center justify-between px-4 h-14">
    <img src="/images/logo/dharstec_logo_white.svg" class="w-36" alt="Dharstec Solutions" />

    <div class="flex items-center gap-1">
      <button (click)="toggleTheme()" class="p-2 rounded-full text-white/80 hover:text-white">
        <app-icon [name]="isDark ? 'sun' : 'moon'" [size]="20"></app-icon>
      </button>

      <button class="p-2 text-white" (click)="toggleMobileMenu()">
        <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- MOBILE DRAWER -->
  <div *ngIf="isMobileMenuOpen" class="px-4 py-4 space-y-1 max-h-[80vh] overflow-y-auto"
       style="background: var(--cs-nav); border-top: 1px solid rgba(255,255,255,.1)">

    <ng-container *ngFor="let menu of menus">

      <button *ngIf="!menu.children"
              (click)="navigate(menu); toggleMobileMenu()"
              class="nav-btn" [class.active]="isActive(menu.path)">
        <app-icon [name]="menu.icon" [size]="20"></app-icon>
        <span>{{ menu.label }}</span>
      </button>

      <div *ngIf="menu.children">
        <button (click)="toggleMenu(menu.label)" class="nav-btn justify-between"
                [class.active]="isChildActive(menu.children)">
          <span class="flex items-center gap-3">
            <app-icon [name]="menu.icon || 'settings'" [size]="20"></app-icon>
            <span>{{ menu.label }}</span>
          </span>
          <svg class="w-3 h-3 transition-transform" [class.rotate-180]="openMenu === menu.label"
               viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
          </svg>
        </button>

        <div *ngIf="openMenu === menu.label" class="nav-sub">
          <button *ngFor="let child of menu.children"
                  (click)="navigate(child); toggleMobileMenu()"
                  class="nav-sub__item" [class.active]="isActive(child.path)">
            {{ child.label }}
          </button>
        </div>
      </div>

    </ng-container>

    <div class="pt-3 mt-2" style="border-top:1px solid rgba(255,255,255,.1)">
      <div class="flex items-center gap-3 px-3 pb-2">
        <div class="side-nav__avatar">{{ userName.charAt(0).toUpperCase() }}</div>
        <div class="min-w-0">
          <p class="text-sm font-medium text-white truncate">{{ userName }}</p>
          <p class="text-[11px] text-[#8E8CC7] truncate">{{ userRole }}</p>
        </div>
      </div>
      <button (click)="logout()" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-red-400">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
        </svg>
        Sign Out
      </button>
    </div>
  </div>
</header>
