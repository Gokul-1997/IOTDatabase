<!-- ══════════ DESKTOP SIDEBAR ══════════ -->
<aside class="hidden lg:flex fixed left-0 top-0 h-screen w-60 z-50 flex-col bg-[#1F1D51] dark:bg-[#141523]">

  <!-- Logo -->
  <div class="px-5 pt-6 pb-8">
    <img src="/images/logo/demo_logo_white.svg" class="w-44" alt="Dharstec Solutions" />
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto px-3 space-y-1 pb-4">

    <ng-container *ngFor="let menu of menus">

      <!-- NORMAL ITEM -->
      <button *ngIf="!menu.children"
              (click)="navigate(menu)"
              class="nav-btn"
              [class.active]="isActive(menu.path)">
        <app-icon [name]="menu.icon" [size]="20"></app-icon>
        {{ menu.label }}
      </button>

      <!-- GROUP ITEM (expandable) -->
      <div *ngIf="menu.children">
        <button (click)="toggleMenu(menu.label)"
                class="nav-btn justify-between"
                [class.active]="isChildActive(menu.children)">
          <span class="flex items-center gap-3">
            <app-icon name="settings" [size]="20"></app-icon>
            {{ menu.label }}
          </span>
          <svg class="w-3 h-3 transition-transform"
               [class.rotate-180]="openMenu === menu.label"
               viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
          </svg>
        </button>

        <!-- Inline children -->
        <div *ngIf="openMenu === menu.label" class="mt-1 ml-4 pl-3 border-l border-white/10 space-y-0.5">
          <button *ngFor="let child of menu.children"
                  (click)="navigate(child)"
                  class="w-full text-left px-3 py-2 rounded-lg text-[13px] text-[#B9B8D9] hover:text-white hover:bg-white/[0.06] transition"
                  [class.text-white]="isActive(child.path)"
                  [class.bg-white/10]="isActive(child.path)">
            {{ child.label }}
          </button>
        </div>
      </div>

    </ng-container>
  </nav>

  <!-- Bottom: theme + user -->
  <div class="px-3 pb-5 pt-3 border-t border-white/10 space-y-2">

    <button (click)="toggleTheme()" class="nav-btn">
      <app-icon [name]="isDark ? 'sun' : 'moon'" [size]="20"></app-icon>
      {{ isDark ? 'Light mode' : 'Dark mode' }}
    </button>

    <div class="user-menu-wrap relative">
      <button (click)="toggleUserMenu()"
              class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/[0.06] transition">
        <div class="h-9 w-9 rounded-full bg-white text-[#1F1D51] flex items-center justify-center font-bold text-sm shrink-0">
          {{ userName.charAt(0).toUpperCase() }}
        </div>
        <div class="text-left min-w-0 flex-1">
          <p class="text-sm font-medium text-white truncate leading-none">{{ userName }}</p>
          <p class="text-[11px] text-[#8E8CC7] truncate leading-none mt-1">{{ userRole }}</p>
        </div>
        <svg class="w-4 h-4 text-[#8E8CC7] transition-transform shrink-0" [class.rotate-180]="showUserMenu"
             viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
        </svg>
      </button>

      <!-- Pop-over -->
      <div *ngIf="showUserMenu"
           class="absolute bottom-full left-0 mb-2 w-full bg-white dark:bg-[#141523] border border-gray-200 dark:border-gray-700 rounded-xl shadow-2xl py-2 z-50">
        <div class="px-4 py-2 border-b border-gray-100 dark:border-gray-700">
          <p class="text-sm font-semibold text-gray-800 dark:text-white truncate">{{ userName }}</p>
          <p *ngIf="userEmail" class="text-xs text-gray-400 truncate mt-1">{{ userEmail }}</p>
        </div>
        <button (click)="logout()"
                class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
          </svg>
          Sign Out
        </button>
      </div>
    </div>
  </div>
</aside>

<!-- ══════════ MOBILE TOP BAR ══════════ -->
<header class="lg:hidden sticky top-0 w-full z-50 bg-[#1F1D51] dark:bg-[#141523]">
  <div class="flex items-center justify-between px-4 h-14">
    <img src="/images/logo/demo_logo_white.svg" class="w-36" alt="Dharstec Solutions" />

    <div class="flex items-center gap-1">
      <button (click)="toggleTheme()" class="p-2 rounded-full text-white/80 hover:text-white">
        <app-icon [name]="isDark ? 'sun' : 'moon'" [size]="20"></app-icon>
      </button>

      <button class="p-2 text-white" (click)="toggleMobileMenu()">
        <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- MOBILE DRAWER -->
  <div *ngIf="isMobileMenuOpen"
       class="bg-[#1F1D51] dark:bg-[#141523] border-t border-white/10 px-4 py-4 space-y-1 max-h-[80vh] overflow-y-auto">

    <ng-container *ngFor="let menu of menus">

      <button *ngIf="!menu.children"
              (click)="navigate(menu); toggleMobileMenu()"
              class="nav-btn"
              [class.active]="isActive(menu.path)">
        <app-icon [name]="menu.icon" [size]="20"></app-icon>
        {{ menu.label }}
      </button>

      <div *ngIf="menu.children" class="space-y-0.5">
        <div class="px-3 pt-3 pb-1 text-[11px] font-semibold uppercase tracking-wider text-[#8E8CC7]">
          {{ menu.label }}
        </div>
        <button *ngFor="let child of menu.children"
                (click)="navigate(child); toggleMobileMenu()"
                class="w-full text-left pl-6 pr-3 py-2 rounded-lg text-sm text-[#B9B8D9] hover:text-white hover:bg-white/[0.06] transition">
          {{ child.label }}
        </button>
      </div>

    </ng-container>

    <!-- Mobile user + logout -->
    <div class="border-t border-white/10 pt-3 mt-2">
      <div class="flex items-center gap-3 px-3 pb-2">
        <div class="h-8 w-8 rounded-full bg-white text-[#1F1D51] flex items-center justify-center font-bold text-xs">
          {{ userName.charAt(0).toUpperCase() }}
        </div>
        <div class="min-w-0">
          <p class="text-sm font-medium text-white truncate">{{ userName }}</p>
          <p class="text-[11px] text-[#8E8CC7] truncate">{{ userRole }}</p>
        </div>
      </div>
      <button (click)="logout()"
              class="w-full flex items-center gap-3 px-3 py-2 text-sm text-red-400">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
        </svg>
        Sign Out
      </button>
    </div>
  </div>
</header>
