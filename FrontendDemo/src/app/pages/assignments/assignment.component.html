<h2>Operator → Machine Assignment</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="form">

  <label>Operator</label>
  <select formControlName="operator_id">
    <option value="">Select Operator</option>
    <option *ngFor="let o of operators" [value]="o.id">
      {{ o.operator_name }}
    </option>
  </select>

  <label>Machine</label>
  <select formControlName="machine_id">
    <option value="">Select Machine</option>
    <option *ngFor="let m of machines" [value]="m.id">
      {{ m.machine_serial_no }}
    </option>
  </select>

  <label>Assigned From</label>
  <input type="date" formControlName="assigned_from" />

  <button type="submit" [disabled]="saving" *ngIf="auth.hasAction('assignments', 'create')">
    {{ saving ? 'Saving...' : 'Assign' }}
  </button>
</form>
