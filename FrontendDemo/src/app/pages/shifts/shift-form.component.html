<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-common w-[420px] rounded-xl p-6 max-h-[90vh] overflow-auto border-modal">

    <!-- Header -->
    <div class="modal-header">
      <h3 class="text-lg font-semibold">{{ data ? 'Edit Shift' : 'Create Shift' }}</h3>
      <button (click)="close.emit()" class="text-gray-500 hover:text-red-500 text-xl">
        ✕
      </button>
    </div>



    <form [formGroup]="form">

      <!-- Shift Code -->
      <div class="mb-3">
        <label class="block text-sm mb-1 font-medium">Shift Code *</label>
        <input
          formControlName="shift_code"
          placeholder="e.g. SHIFT-A"
          class="filter-select"
          [class.border-red-500]="form.get('shift_code')?.invalid && form.get('shift_code')?.touched" />
        <div *ngIf="form.get('shift_code')?.touched && form.get('shift_code')?.errors?.['required']"
          class="mt-1 text-xs text-red-500">
          Shift Code is required.
        </div>
      </div>

      <!-- Shift Name -->
      <div class="mb-3">
        <label class="block text-sm mb-1 font-medium">Shift Name</label>
        <input
          formControlName="shift_name"
          placeholder="e.g. Morning Shift"
          class="filter-select" />
      </div>

      <!-- Start / End Time -->
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-sm mb-1 font-medium">Start Time *</label>
          <input
            type="time"
            formControlName="start_time"
            (click)="openTimePicker($event)"
            class="filter-select"
            [class.border-red-500]="form.get('start_time')?.invalid && form.get('start_time')?.touched" />
          <div *ngIf="form.get('start_time')?.touched && form.get('start_time')?.errors?.['required']"
            class="mt-1 text-xs text-red-500">Required.</div>
        </div>
        <div>
          <label class="block text-sm mb-1 font-medium">End Time *</label>
          <input
            type="time"
            formControlName="end_time"
            (click)="openTimePicker($event)"
            class="filter-select"
            [class.border-red-500]="form.get('end_time')?.invalid && form.get('end_time')?.touched" />
          <div *ngIf="form.get('end_time')?.touched && form.get('end_time')?.errors?.['required']"
            class="mt-1 text-xs text-red-500">Required.</div>
        </div>
      </div>

      <!-- Validation errors -->
      <div *ngIf="form.errors?.['invalidDuration']" class="mb-2 text-xs text-red-500">
        Invalid shift duration.
      </div>
      <div *ngIf="form.errors?.['invalidBreak']" class="mb-2 text-xs text-red-500">
        Break cannot be greater than shift duration.
      </div>

      <!-- Break Minutes -->
      <div class="mb-4">
        <label class="block text-sm mb-1 font-medium">Break (Minutes)</label>
        <input
          type="number"
          min="0"
          formControlName="break_minutes"
          placeholder="0"
          class="filter-select"
          [class.border-red-500]="form.get('break_minutes')?.invalid && form.get('break_minutes')?.touched" />
        <div *ngIf="form.get('break_minutes')?.touched && form.get('break_minutes')?.errors?.['min']"
          class="mt-1 text-xs text-red-500">
          Break minutes cannot be negative.
        </div>
      </div>

      <!-- Active Status -->
      <div class="mb-4 flex items-center gap-3">
        <input type="checkbox" formControlName="is_active" id="is_active"
          class="w-4 h-4 rounded" />
        <label for="is_active" class="text-sm font-medium">Active</label>
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-3">
        <button type="button" (click)="close.emit()" class="btn-secondary">
          Cancel
        </button>
        <button type="button" (click)="submit()" [disabled]="saving"
          class="btn-primary">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>

    </form>
  </div>
</div>
