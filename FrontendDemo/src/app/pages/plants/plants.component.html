<div class="page-wrapper">

  <!-- HEADER -->
  <div class="bg-top-bar flex-wrap">
    <div class="toolbar-left">
      <div class="page-title">
        <mat-icon class="title-icon">factory</mat-icon>
        <div>
          <h2>Plants</h2>
        </div>
        <span class="subtitle">{{ total }} plant{{ total !== 1 ? 's' : '' }} total</span>
      </div>
    </div>

    <div class="toolbar-right">
      <!-- Search -->
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input type="text" [(ngModel)]="search" (ngModelChange)="onSearchInput()"
          placeholder="Search code / name…" class="search-input" />
        <button *ngIf="search" mat-icon-button class="clear-btn" (click)="search=''; onSearchInput()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <!-- Add Plant -->
      <button class="btn-primary" (click)="openCreate()" *ngIf="auth.hasAction('plants', 'create')">
        <mat-icon>add</mat-icon>
        New Plant
      </button>
    </div>
  </div>

  <!-- ── TABLE CARD ──────────────────────────────────────────────────── -->
  <div class="table-card mat-elevation-z2">

    <!-- Loading overlay -->
    <div *ngIf="loading" class="loading-overlay">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="rows" class="machines-table">

        <!-- # -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef class="col-index thead-custm">#</th>
          <td mat-cell *matCellDef="let r; let i = index" class="col-index">{{ rowIndex(i) }}</td>
        </ng-container>

        <!-- Code -->
        <ng-container matColumnDef="plant_code">
          <th mat-header-cell *matHeaderCellDef class="thead-custm">Code</th>
          <td mat-cell *matCellDef="let r"><span class="serial-no">{{ r.plant_code }}</span></td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="plant_name">
          <th mat-header-cell *matHeaderCellDef class="thead-custm">Name</th>
          <td mat-cell *matCellDef="let r">{{ r.plant_name }}</td>
        </ng-container>

        <!-- Location -->
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef class="thead-custm">Location</th>
          <td mat-cell *matCellDef="let r">{{ r.location || '—' }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="is_active">
          <th mat-header-cell *matHeaderCellDef class="thead-custm">Status</th>
          <td mat-cell *matCellDef="let r">
            <mat-slide-toggle color="primary" [checked]="r.is_active" (change)="toggle(r)"
              [matTooltip]="r.is_active ? 'Active – click to deactivate' : 'Inactive – click to activate'">
            </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions" [stickyEnd]="true">
          <th mat-header-cell *matHeaderCellDef class="col-actions thead-custm">Actions</th>
          <td mat-cell *matCellDef="let r" class="col-actions">
            <button mat-icon-button class="action-edit" (click)="openEdit(r)" matTooltip="Edit" *ngIf="auth.hasAction('plants', 'edit')">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="data-row"></tr>

      </table>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && rows.length === 0" class="empty-state">
      <mat-icon>factory</mat-icon>
      <p>No plants found</p>
      <span>Try adjusting your search or add a new plant.</span>
    </div>

    <!-- Paginator -->
    <mat-paginator
      [length]="total"
      [pageSize]="limit"
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons
      (page)="onPage($event)"
      class="mat-paginator-sticky">
    </mat-paginator>

  </div>

  <!-- MODAL -->
  <app-plant-form *ngIf="showForm" [data]="editData" (close)="showForm=false" (saved)="onSaved()">
  </app-plant-form>

</div>
