<div class="min-h-screen relative flex items-center justify-center overflow-hidden bg-[#14132E]">

  <!-- Ambient glow accents -->
  <div class="absolute -top-32 -left-32 w-[28rem] h-[28rem] rounded-full bg-[#4C49A0] opacity-25 blur-[140px]"></div>
  <div class="absolute -bottom-40 -right-24 w-[30rem] h-[30rem] rounded-full bg-[#6663B8] opacity-20 blur-[160px]"></div>

  <!-- Subtle grid pattern -->
  <div class="absolute inset-0 opacity-[0.05]"
       style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 44px 44px;"></div>

  <!-- CARD -->
  <div class="relative w-full max-w-md mx-4">

    <!-- Brand mark above card -->
    <div class="flex flex-col items-center mb-8 select-none">
      <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center shadow-lg shadow-black/30 mb-4">
        <svg width="30" height="30" viewBox="0 0 32 32">
          <path d="M9 6 v20 h8 a10 10 0 0 0 0 -20 z" fill="none" stroke="#1F1D51" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="text-white text-2xl font-bold tracking-tight">Dharstec Solutions</h1>
      <p class="text-[#8E8CC7] text-sm mt-1">Smart Manufacturing Platform</p>
    </div>

    <div class="bg-white dark:bg-[#141523] rounded-3xl shadow-2xl shadow-black/40 p-8">

      <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-1">Welcome back</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Sign in to your workspace</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-1.5">Email</label>
          <input type="email" formControlName="email" placeholder="you@company.com"
                 class="w-full rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-[#0B0C15] px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1F1D51] dark:focus:ring-[#6663B8] focus:border-transparent transition"
                 [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched" />
          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-1.5">Password</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••"
                   class="w-full rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-[#0B0C15] px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1F1D51] dark:focus:ring-[#6663B8] focus:border-transparent transition"
                   [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched" />
            <button type="button" (click)="togglePassword()"
                    class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5 -3.75 7.5-9.75 7.5 -9.75-7.5-9.75-7.5z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3l18 18M9.88 9.88a3 3 0 104.24 4.24"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M10.73 5.08A9.956 9.956 0 0112 4.5c6 0 9.75 7.5 9.75 7.5a10.45 10.45 0 01-4.293 4.774M6.228 6.228A9.956 9.956 0 002.25 12s3.75 7.5 9.75 7.5c1.772 0 3.37-.356 4.77-.972"/>
              </svg>
            </button>
          </div>
          <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <!-- Forgot -->
        <div class="text-right">
          <a routerLink="/forgot-password" class="text-sm font-medium text-[#1F1D51] dark:text-[#8E8CC7] hover:underline">Forgot password?</a>
        </div>

        <!-- API Error Banner -->
        <div *ngIf="error"
             class="flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-800 px-4 py-3">
          <svg class="w-5 h-5 text-red-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
          <div class="flex-1">
            <p class="text-sm font-medium text-red-700 dark:text-red-400">{{ error }}</p>
          </div>
          <button type="button" (click)="error = ''" class="text-red-400 hover:text-red-600 transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="loading"
                class="w-full flex items-center justify-center gap-2 rounded-xl bg-[#1F1D51] hover:bg-[#2E2B77] disabled:opacity-60 text-white font-semibold py-3 text-sm transition shadow-lg shadow-[#1F1D51]/30">
          <svg *ngIf="loading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-[#8E8CC7] mt-6">
      © 2026 Dharstec Solutions Private Limited
    </p>
  </div>
</div>
