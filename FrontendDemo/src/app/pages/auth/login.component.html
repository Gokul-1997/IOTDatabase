<div class="min-h-screen flex bg-gray-100 dark:bg-neutral-900">
  <!-- Dark mode toggle -->
  <button (click)="toggleDark()" class="absolute top-6 right-6
w-10 h-10
flex items-center justify-center
rounded-lg
bg-white dark:bg-neutral-800
border border-gray-200 dark:border-neutral-700
shadow-sm
hover:scale-105 transition">
    <!-- Sun icon -->
    <svg xmlns="http://www.w3.org/2000/svg" *ngIf="isDark" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
      stroke="currentColor" class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
    </svg>
    <!-- Moon icon -->
    <svg *ngIf="!isDark" class="w-5 h-5 text-gray-700 dark:text-gray-200" fill="currentColor" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1111.21 3
7 7 0 0021 12.79z" />
    </svg>
  </button>
  <!-- LEFT SIDE CAROUSEL -->
  <!-- LEFT -->
  <!-- LEFT CAROUSEL -->
  <div class="hidden lg:flex w-1/2 relative justify-center overflow-hidden pt-24 md:pt-4">
    <!-- Fixed gradient -->
    <div class="absolute inset-0 bg-gradient-to-bl from-[#C5404A] via-[#5E3C79] to-[#4A2FA0]"></div>
    <!-- Carousel container -->
    <div (mouseenter)="pauseCarousel()" (mouseleave)="resumeCarousel()" (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)" (mousedown)="onMouseDown($event)" (mouseup)="onMouseUp($event)">
      <!-- Slides -->
      <!-- OUTER WRAPPER  -->
      <div class="relative w-full ">
        <!-- SLIDER TRACK -->
        <div class="flex transition-transform duration-700 ease-out"
          [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
          <!-- EACH SLIDE -->
          <div *ngFor="let slide of slides" class="w-full flex-shrink-0 text-white select-none">
            <!-- IMAGE -->
            <div class="relative flex justify-center">
              <div
                class="absolute w-96 h-96 bg-white rounded-full blur-[120px] opacity-40 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
              </div>
              <img [src]="slide.image" class="relative mb-10 mx-auto pointer-events-none">
            </div>
            <!-- TEXT -->
            <div class="max-w-md mx-auto px-6 md:-mt-4">
              <h1 class="text-5xl md:text-3xl font-bold mb-4">
                {{slide.title}}
              </h1>
              <div class="w-12 h-1 bg-white mb-6 rounded "></div>
              <p class="text-white/80">
                {{slide.desc}}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Indicators -->
    <div class="absolute md:bottom-5 bottom-32 left-40 flex gap-3">
      <div *ngFor="let slide of slides; let i=index" (click)="goToSlide(i)" class="w-3 h-3 rounded-full cursor-pointer"
        [ngClass]="currentSlide === i ? 'bg-white' : 'bg-white/40'"></div>
    </div>
  </div>
  <!-- RIGHT SIDE LOGIN -->
  <div class="flex flex-1 items-center justify-center px-6">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <img src="/images/logo/STM_Mexa_logo.svg" class="mb-8 dark:hidden" />
      <img src="/images/logo/STM_Mexa_logo.svg" class="mb-8 hidden dark:block" />
      <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2"> Sign In </h2>
      <p class="text-gray-500 dark:text-gray-400 mb-6"> Enter your email and password to sign in </p>
      <!-- FORM -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <!-- Email -->
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300"> Email </label>
          <input type="email" formControlName="email" placeholder="Enter your email" class="filter-select"
                   [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched" />
          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>
        <!-- Password -->
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300"> Password </label>
<div class="relative">

  <input
    [type]="showPassword ? 'text' : 'password'"
    formControlName="password"
    placeholder="Enter your password"
    class="filter-select"
    [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched" />

  <!-- Professional Eye Toggle Button -->
  <button
    type="button"
    (click)="togglePassword()"
    class="absolute inset-y-0 right-0 flex items-center px-3
           text-gray-400 hover:text-gray-600
           dark:hover:text-white
           transition">

    <!-- Eye Open -->
    <svg *ngIf="!showPassword"
         xmlns="http://www.w3.org/2000/svg"
         class="w-5 h-5"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor">
      <path stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M2.25 12s3.75-7.5 9.75-7.5
               9.75 7.5 9.75 7.5
               -3.75 7.5-9.75 7.5
               -9.75-7.5-9.75-7.5z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>

    <!-- Eye Closed -->
    <svg *ngIf="showPassword"
         xmlns="http://www.w3.org/2000/svg"
         class="w-5 h-5"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor">
      <path stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M3 3l18 18M9.88 9.88a3 3 0 104.24 4.24"/>
      <path stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M10.73 5.08A9.956 9.956 0 0112 4.5
               c6 0 9.75 7.5 9.75 7.5
               a10.45 10.45 0 01-4.293 4.774
               M6.228 6.228A9.956 9.956 0 002.25 12
               s3.75 7.5 9.75 7.5
               c1.772 0 3.37-.356 4.77-.972"/>
    </svg>

  </button>

</div>
          <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>
        <!-- Forgot -->
        <div class="text-right">
          <a routerLink="/forgot-password" class="text-sm text-[#2f4ac4] hover:underline"> Forgot Password? </a>
        </div>

        <!-- API Error Banner -->
        <div *ngIf="error"
          class="flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-800 px-4 py-3">
          <svg class="w-5 h-5 text-red-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
          <div class="flex-1">
            <p class="text-sm font-medium text-red-700 dark:text-red-400">{{ error }}</p>
          </div>
          <button type="button" (click)="error = ''" class="text-red-400 hover:text-red-600 transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Button -->
        <button type="submit" [disabled]="loading"
          class="btn-primary text-center w-full justify-center">
          <svg *ngIf="loading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
