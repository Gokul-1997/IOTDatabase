<div class="min-h-screen flex bg-gray-100 dark:bg-neutral-900 items-center justify-center px-6">

  <div class="w-full max-w-md">

    <img src="/images/logo/STM_Mexa_logo.svg" class="mb-8 dark:hidden" />
    <img src="/images/logo/STM_Mexa_logo.svg" class="mb-8 hidden dark:block" />

    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2">
      Reset Password
    </h2>

    <p class="text-gray-500 dark:text-gray-400 mb-6">
      Enter your new password below.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

      <!-- New Password -->
      <div>
        <label class="text-sm text-gray-600 dark:text-gray-300">New Password</label>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter new password"
            class="w-full mt-1 px-4 py-3 pr-12 rounded-lg border
                   border-gray-300 dark:border-neutral-700
                   bg-white dark:bg-neutral-800
                   text-gray-800 dark:text-white
                   focus:ring-2 focus:ring-indigo-500 outline-none"
            [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched" />

          <button type="button" (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5-9.75-7.5-9.75-7.5z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3l18 18M9.88 9.88a3 3 0 104.24 4.24"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.73 5.08A9.956 9.956 0 0112 4.5c6 0 9.75 7.5 9.75 7.5a10.45 10.45 0 01-4.293 4.774M6.228 6.228A9.956 9.956 0 002.25 12s3.75 7.5 9.75 7.5c1.772 0 3.37-.356 4.77-.972"/>
            </svg>
          </button>
        </div>

        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="mt-1 text-xs text-red-500">
          <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
          <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 8 characters.</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="text-sm text-gray-600 dark:text-gray-300">Confirm Password</label>

        <div class="relative">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirm_password"
            placeholder="Confirm your password"
            class="w-full mt-1 px-4 py-3 pr-12 rounded-lg border
                   border-gray-300 dark:border-neutral-700
                   bg-white dark:bg-neutral-800
                   text-gray-800 dark:text-white
                   focus:ring-2 focus:ring-indigo-500 outline-none"
            [class.border-red-500]="(form.get('confirm_password')?.touched && form.get('confirm_password')?.invalid) || (form.errors?.['passwordMismatch'] && form.get('confirm_password')?.touched)" />

          <button type="button" (click)="showConfirm = !showConfirm"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition">
            <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5-9.75-7.5-9.75-7.5z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3l18 18M9.88 9.88a3 3 0 104.24 4.24"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.73 5.08A9.956 9.956 0 0112 4.5c6 0 9.75 7.5 9.75 7.5a10.45 10.45 0 01-4.293 4.774M6.228 6.228A9.956 9.956 0 002.25 12s3.75 7.5 9.75 7.5c1.772 0 3.37-.356 4.77-.972"/>
            </svg>
          </button>
        </div>

        <div *ngIf="form.get('confirm_password')?.touched" class="mt-1 text-xs text-red-500">
          <span *ngIf="form.get('confirm_password')?.errors?.['required']">Confirm password is required.</span>
          <span *ngIf="!form.get('confirm_password')?.errors?.['required'] && form.errors?.['passwordMismatch']">Passwords do not match.</span>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition">
        Reset Password
      </button>

    </form>

    <!-- Success -->
    <p *ngIf="success" class="text-green-600 text-sm mt-4">
      {{ message }}
    </p>

    <!-- Error -->
    <p *ngIf="!success && message" class="text-red-500 text-sm mt-4">
      {{ message }}
    </p>

    <div class="text-center mt-6">
      <a routerLink="/login" class="text-indigo-600 hover:underline text-sm">
        ← Back to Login
      </a>
    </div>

  </div>

</div>
