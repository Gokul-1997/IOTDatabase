<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">

  <div class="bg-common w-[840px] rounded-xl p-6 max-h-[90vh] overflow-auto border-modal">
    <div class="flex justify-between">
      <h3 class="text-lg font-semibold mb-4">
      {{ data ? 'Edit Machine' : 'Create Machine' }}
    </h3>
    <span (click)="close.emit()" class="cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
      <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
    </svg>
  </span>
    </div>
    
  
    <form [formGroup]="form">

        <div class="grid grid-cols-12 gap-6">
          
          <!-- Left Image -->
          <div class="col-span-12 md:col-span-3">
  <div class="border dark:border-[#3e3e3e] rounded-lg p-3 flex items-center justify-center h-48">

    <!-- Placeholder -->
    <div 
      *ngIf="!previewUrl && !form.get('image_url')?.value"
      class="flex flex-col items-center text-gray-400"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" 
           viewBox="0 0 24 24" stroke-width="1.5" 
           stroke="currentColor" class="size-10">
        <path stroke-linecap="round" stroke-linejoin="round" 
          d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 
          1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 
          1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 
          2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 
          0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
      <span>No Image</span>
    </div>

    <!-- Image Preview -->
    <img 
      *ngIf="previewUrl || form.get('image_url')?.value"
      [src]="previewUrl || form.get('image_url')?.value"
      alt="Machine"
      class="max-h-full object-contain rounded"
    >

  </div>
</div>

          <!-- Right Form -->
          <div class="col-span-12 md:col-span-9 space-y-4">

            <!-- Upload -->
            <div>
              <label class="block text-sm font-medium mb-1">Machine Image</label>
              <input type="file" accept="image/*" (change)="onFileSelect($event)" class="filter-select">
            </div>

            <!-- Row 1 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Select Line <span class="text-red-600">*</span></label>
                <select
                formControlName="line_id"
                class="filter-select"
                [class.border-red-500]="form.get('line_id')?.invalid && form.get('line_id')?.touched">

                <option [ngValue]="null">Select Line</option>

                <option *ngFor="let l of lines" [ngValue]="l.id">
                  {{ l.name }}
                </option>

              </select>
              <div *ngIf="form.get('line_id')?.touched && form.get('line_id')?.errors?.['required']"
                class="mt-1 text-xs text-red-500">
                Please select a line.
              </div>
              </div>

              <div>
                <label class="block text-sm font-medium mb-1">Machine Serial No <span class="text-red-600">*</span></label>
                <input formControlName="machine_serial_no" placeholder="Machine Serial No *"
                  class="filter-select"
                  [class.border-red-500]="form.get('machine_serial_no')?.invalid && form.get('machine_serial_no')?.touched" />
                <div *ngIf="form.get('machine_serial_no')?.touched && form.get('machine_serial_no')?.errors?.['required']"
                  class="mt-1 text-xs text-red-500">
                  Machine Serial No is required.
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium mb-1">Machine Model</label>
                <input formControlName="model" placeholder="Machine Model"
        class="filter-select" />
              </div>
            </div>

            <!-- Row 2 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <!-- Controller -->
       <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">Controller</label>
      <input formControlName="controller" placeholder="Controller"
        class="filter-select" />
        </div>

      <!-- MMC -->
       <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">MMC No</label>
      <input formControlName="mmc_no" placeholder="MMC No"
        class="filter-select" />
        </div>

      <!-- Spindle RPM -->
       <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">Spindle RPM</label>
      <input type="number" formControlName="spindle_rpm" placeholder="Spindle RPM"
        class="filter-select" />
        </div>

      <!-- Axis -->

        <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">X Axis</label>
        <input type="number" formControlName="x_axis" placeholder="X Axis"
          class="filter-select" />
          </div>
            </div>

            <!-- Row 3 -->
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
              <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">Y Axis</label>
        <input type="number" formControlName="y_axis" placeholder="Y Axis"
          class="filter-select" />
          </div>

        <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">Z Axis</label>
        <input type="number" formControlName="z_axis" placeholder="Z Axis"
          class="filter-select" />
        </div>

        <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">4th Axis</label>
        <input type="number" formControlName="fourth_axis" placeholder="4th Axis"
          class="filter-select" />
        </div>

        <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">5th Axis</label>
        <input type="number" formControlName="fifth_axis" placeholder="5th Axis"
          class="filter-select" />
        </div>

      <!-- ATC -->
       <div class="mb-0">
        <label class="block text-sm mb-1 font-medium">ATC Tool Capacity</label>
      <input formControlName="atc_tool_capacity" placeholder="ATC Tool Capacity"
        class="filter-select" />
        </div>
            </div>

            <!-- Checkboxes -->
            <div class="flex items-center gap-6 pt-2">
              <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" formControlName="twin_spindle">
                Twin Spindle
              </label>

              <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" formControlName="twin_table">
                Twin Table
              </label>

              <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" formControlName="is_active">
                Active
              </label>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-3 pt-4">
              <button (click)="close.emit()" class="btn-secondary">
                Cancel
              </button>
              <button (click)="save()" [disabled]="uploading || isUnchanged" class="btn btn-default">
                {{ uploading ? 'Uploading...' : 'Save' }}
              </button>
            </div>

          </div>
        </div>

    </form>



</div>
