<div class="ui-overlay">
  <div class="ui-dialog ui-dialog-sm" role="dialog" aria-modal="true" aria-labelledby="lineFormTitle">

    <div class="ui-dialog-header">
      <div>
        <h2 id="lineFormTitle" class="ui-dialog-title">{{ data ? 'Edit Line' : 'Create Line' }}</h2>
        <p class="ui-dialog-subtitle">A production line groups the machines that run together.</p>
      </div>
      <button type="button" class="ui-close" (click)="close.emit()" aria-label="Close without saving">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             class="w-5 h-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" class="contents">
      <div class="ui-dialog-body">

        <div class="ui-field">
          <label class="ui-label" for="lineName">
            Line name<span class="ui-req" aria-hidden="true">*</span>
          </label>
          <input id="lineName" class="ui-input" formControlName="name"
                 placeholder="e.g. Assembly Line A" autocomplete="off" aria-required="true"
                 [class.is-invalid]="invalid('name')"
                 [attr.aria-invalid]="invalid('name')"
                 [attr.aria-describedby]="invalid('name') ? 'lineNameErr' : null" />
          <p *ngIf="invalid('name')" id="lineNameErr" class="ui-error" role="alert">
            Line name is required.
          </p>
        </div>

        <div class="ui-field">
          <label class="ui-toggle">
            <input type="checkbox" formControlName="is_active" />
            <span>
              <span class="ui-toggle-label">Active</span>
              <span class="ui-toggle-hint">Include this line in dashboards and reports</span>
            </span>
          </label>
        </div>

      </div>

      <div class="ui-dialog-footer is-split">
        <p class="ui-hint !mt-0"><span class="ui-req" aria-hidden="true">*</span> Required fields</p>
        <div class="flex items-center gap-2">
          <button type="button" class="ui-btn ui-btn-ghost" (click)="close.emit()">Cancel</button>
          <button type="button" class="ui-btn ui-btn-primary" (click)="submit()" [disabled]="saving">
            <span *ngIf="saving" class="ui-spinner" aria-hidden="true"></span>
            {{ saving ? 'Saving…' : (data ? 'Save changes' : 'Create line') }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
