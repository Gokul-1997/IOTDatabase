<h2>Machine → Shift Configuration</h2>

<form [formGroup]="form">
  <label>Machine</label>

  <select formControlName="machine_id" (change)="loadConfig()">
    <option value="">Select Machine</option>
    <option *ngFor="let m of machines" [value]="m.id">
      {{ m.machine_serial_no }}
    </option>
  </select>
</form>

<div class="shift-list" *ngIf="form.value.machine_id">
  <h4>Available Shifts</h4>

  <div *ngFor="let s of shifts">
    <input
      type="checkbox"
      [checked]="selectedShifts.includes(s.id)"
      (change)="toggleShift(s.id, $any($event.target).checked)"
    />
    {{ s.shift_name }} ({{ s.start_time }} - {{ s.end_time }})
  </div>

  <button (click)="save()">Save Configuration</button>
</div>
