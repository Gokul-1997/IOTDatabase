<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-[#0f1c33] w-[420px] rounded-xl p-6 max-h-[90vh] overflow-auto">

    <h3 class="text-lg font-semibold mb-4">
      {{ data ? 'Edit Plant' : 'Create Plant' }}
    </h3>

    <form [formGroup]="form">

      <!-- Plant Code -->
      <div class="mb-3">
        <label class="block text-sm mb-1 font-medium">Plant Code *</label>
        <input
          formControlName="plant_code"
          placeholder="e.g. PLT-001"
          class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
          [class.border-red-500]="form.get('plant_code')?.invalid && form.get('plant_code')?.touched" />
        <div *ngIf="form.get('plant_code')?.touched && form.get('plant_code')?.errors?.['required']"
          class="mt-1 text-xs text-red-500">
          Plant Code is required.
        </div>
      </div>

      <!-- Plant Name -->
      <div class="mb-3">
        <label class="block text-sm mb-1 font-medium">Plant Name *</label>
        <input
          formControlName="plant_name"
          placeholder="Plant Name"
          class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
          [class.border-red-500]="form.get('plant_name')?.invalid && form.get('plant_name')?.touched" />
        <div *ngIf="form.get('plant_name')?.touched && form.get('plant_name')?.errors?.['required']"
          class="mt-1 text-xs text-red-500">
          Plant Name is required.
        </div>
      </div>

      <!-- Location -->
      <div class="mb-4">
        <label class="block text-sm mb-1 font-medium">Location</label>
        <input
          formControlName="location"
          placeholder="Location"
          class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border" />
      </div>

      <!-- Error message (quota exceeded or any backend error) -->
      <div *ngIf="errorMsg" class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-300 text-red-700 text-sm">
        {{ errorMsg }}
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-3">
        <button type="button" (click)="close.emit()" [disabled]="saving"
          class="px-4 py-2 bg-gray-300 rounded disabled:opacity-50">
          Cancel
        </button>
        <button type="button" (click)="save()" [disabled]="saving"
          class="px-4 py-2 bg-blue-600 text-white rounded disabled:opacity-50 flex items-center gap-2">
          <span *ngIf="saving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>

    </form>
  </div>
</div>
