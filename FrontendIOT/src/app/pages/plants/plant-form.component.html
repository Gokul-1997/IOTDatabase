<div class="ui-overlay">
  <div class="ui-dialog ui-dialog-sm" role="dialog" aria-modal="true" aria-labelledby="plantFormTitle">

    <div class="ui-dialog-header">
      <div>
        <h2 id="plantFormTitle" class="ui-dialog-title">{{ data ? 'Edit Plant' : 'Create Plant' }}</h2>
        <p class="ui-dialog-subtitle">A plant is a physical site holding lines and machines.</p>
      </div>
      <button type="button" class="ui-close" (click)="close.emit()" aria-label="Close without saving">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             class="w-5 h-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" class="contents">
      <div class="ui-dialog-body">

        <!-- Backend failures (quota exceeded, duplicate code) land here rather
             than in a toast that vanishes before it can be read. -->
        <div *ngIf="errorMsg" class="ui-alert ui-alert-error mb-4" role="alert">
          {{ errorMsg }}
        </div>

        <div class="ui-field">
          <label class="ui-label" for="plantCode">
            Plant code<span class="ui-req" aria-hidden="true">*</span>
          </label>
          <input id="plantCode" class="ui-input" formControlName="plant_code"
                 placeholder="e.g. PLT-001" autocomplete="off" aria-required="true"
                 [class.is-invalid]="invalid('plant_code')"
                 [attr.aria-invalid]="invalid('plant_code')"
                 [attr.aria-describedby]="invalid('plant_code') ? 'plantCodeErr' : null" />
          <p *ngIf="invalid('plant_code')" id="plantCodeErr" class="ui-error" role="alert">
            Plant code is required.
          </p>
        </div>

        <div class="ui-field">
          <label class="ui-label" for="plantName">
            Plant name<span class="ui-req" aria-hidden="true">*</span>
          </label>
          <input id="plantName" class="ui-input" formControlName="plant_name"
                 placeholder="e.g. Coimbatore Unit 1" autocomplete="off" aria-required="true"
                 [class.is-invalid]="invalid('plant_name')"
                 [attr.aria-invalid]="invalid('plant_name')"
                 [attr.aria-describedby]="invalid('plant_name') ? 'plantNameErr' : null" />
          <p *ngIf="invalid('plant_name')" id="plantNameErr" class="ui-error" role="alert">
            Plant name is required.
          </p>
        </div>

        <div class="ui-field">
          <label class="ui-label" for="plantLocation">Location</label>
          <input id="plantLocation" class="ui-input" formControlName="location"
                 placeholder="City or address" autocomplete="off" />
        </div>

      </div>

      <div class="ui-dialog-footer is-split">
        <p class="ui-hint !mt-0"><span class="ui-req" aria-hidden="true">*</span> Required fields</p>
        <div class="flex items-center gap-2">
          <button type="button" class="ui-btn ui-btn-ghost" (click)="close.emit()" [disabled]="saving">
            Cancel
          </button>
          <button type="button" class="ui-btn ui-btn-primary" (click)="save()" [disabled]="saving">
            <span *ngIf="saving" class="ui-spinner" aria-hidden="true"></span>
            {{ saving ? 'Saving…' : (data ? 'Save changes' : 'Create plant') }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
