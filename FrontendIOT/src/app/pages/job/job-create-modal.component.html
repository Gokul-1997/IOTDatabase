<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-common w-[560px] rounded-xl shadow-2xl max-h-[90vh] overflow-auto border-modal">

    <!-- Header -->
    <div class="modal-header">
      <h3 class="text-lg font-semibold">Start New Job</h3>
      <button (click)="cancel()" class="text-gray-400 hover:text-red-500 text-xl">✕</button>
    </div>

    <div class="p-6 space-y-4">

      <!-- Error banner -->
      <div *ngIf="error"
           class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">
        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10A8 8 0 1 1 2 10a8 8 0 0 1 16 0zm-8-3a1 1 0 0 0-.867.5l-3 5A1 1 0 0 0 7 14h6a1 1 0 0 0 .867-1.5l-3-5A1 1 0 0 0 10 7z" clip-rule="evenodd"/>
        </svg>
        {{ error }}
      </div>

      <!-- No available machines warning -->
      <div *ngIf="machines.length === 0"
           class="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-700 text-sm px-4 py-3 rounded-lg">
        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-1-8a1 1 0 0 0-1 1v3a1 1 0 0 0 2 0V6a1 1 0 0 0-1-1z" clip-rule="evenodd"/>
        </svg>
        All machines already have active jobs. Stop a job first to start a new one.
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Machine -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Machine <span class="text-red-500">*</span></label>
          <select [(ngModel)]="form.machine_id" (ngModelChange)="onMachineChange()" class="filter-select"
                  [disabled]="machines.length === 0">
            <option value="">— Select Machine —</option>
            <option *ngFor="let m of machines" [ngValue]="m.id">
              {{ m.machine_serial_no }}
            </option>
          </select>
          <p class="text-xs text-gray-400">Only available (idle) machines shown.</p>
        </div>

        <!-- Component -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Component / Part <span class="text-red-500">*</span></label>
          <select [(ngModel)]="form.component_id" class="filter-select"
                  [disabled]="!form.machine_id">
            <option value="">{{ form.machine_id ? '— Select Component —' : '— Select machine first —' }}</option>
            <option *ngFor="let c of components" [ngValue]="c.id">
              {{ c.part_name }} (Target: {{ c.target }})
            </option>
          </select>
        </div>

        <!-- Job Start -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Job Start <span class="text-red-500">*</span></label>
          <input type="datetime-local" [(ngModel)]="form.job_start" class="filter-select" />
        </div>

      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button type="button" (click)="cancel()" class="btn-secondary">Cancel</button>
        <button type="button" (click)="save()"
                [disabled]="saving || machines.length === 0"
                class="btn-default disabled:opacity-50 disabled:cursor-not-allowed">
          {{ saving ? 'Starting…' : 'Start Job' }}
        </button>
      </div>

    </div>
  </div>
</div>
