<div class="ui-overlay">
  <div class="ui-dialog" role="dialog" aria-modal="true" aria-labelledby="jobFormTitle">

    <div class="ui-dialog-header">
      <div>
        <h2 id="jobFormTitle" class="ui-dialog-title">Start New Job</h2>
        <p class="ui-dialog-subtitle">Book a component onto an idle machine.</p>
      </div>
      <button type="button" class="ui-close" (click)="cancel()" aria-label="Close without starting a job">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             class="w-5 h-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="ui-dialog-body">

      <div *ngIf="error" class="ui-alert ui-alert-error mb-4" role="alert">
        {{ error }}
      </div>

      <div *ngIf="machines.length === 0" class="ui-alert ui-alert-warn mb-4" role="status">
        All machines already have an active job. Stop one before starting another.
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div>
          <label class="ui-label" for="jobMachine">
            Machine<span class="ui-req" aria-hidden="true">*</span>
          </label>
          <select id="jobMachine" class="ui-input" aria-required="true"
                  [(ngModel)]="form.machine_id" (ngModelChange)="onMachineChange()"
                  [disabled]="machines.length === 0"
                  aria-describedby="jobMachineHint">
            <option value="">Select a machine</option>
            <option *ngFor="let m of machines" [ngValue]="m.id">{{ m.machine_serial_no }}</option>
          </select>
          <p id="jobMachineHint" class="ui-hint">Only idle machines are listed.</p>
        </div>

        <div>
          <label class="ui-label" for="jobComponent">
            Component / part<span class="ui-req" aria-hidden="true">*</span>
          </label>
          <select id="jobComponent" class="ui-input" aria-required="true"
                  [(ngModel)]="form.component_id" [disabled]="!form.machine_id">
            <option value="">{{ form.machine_id ? 'Select a component' : 'Select a machine first' }}</option>
            <option *ngFor="let c of components" [ngValue]="c.id">
              {{ c.part_name }} (target {{ c.target }})
            </option>
          </select>
        </div>

        <div class="sm:col-span-2">
          <label class="ui-label" for="jobStart">
            Job start<span class="ui-req" aria-hidden="true">*</span>
          </label>
          <input id="jobStart" class="ui-input" type="datetime-local"
                 [(ngModel)]="form.job_start" aria-required="true" />
        </div>

      </div>
    </div>

    <div class="ui-dialog-footer is-split">
      <p class="ui-hint !mt-0"><span class="ui-req" aria-hidden="true">*</span> Required fields</p>
      <div class="flex items-center gap-2">
        <button type="button" class="ui-btn ui-btn-ghost" (click)="cancel()">Cancel</button>
        <button type="button" class="ui-btn ui-btn-primary" (click)="save()"
                [disabled]="saving || machines.length === 0">
          <span *ngIf="saving" class="ui-spinner" aria-hidden="true"></span>
          {{ saving ? 'Starting…' : 'Start job' }}
        </button>
      </div>
    </div>

  </div>
</div>
