# Mosquitto settings the ingestion service relies on.
#
# The collector subscribes with a persistent session (clean: false, QoS 1,
# a fixed client id). While it restarts or is deployed, the broker keeps its
# messages — but only up to max_queued_messages, then it DROPS the rest.
# Mosquitto's default is 1000: at 100 machines × 1 msg/s that is 10 seconds.
# Measured 7 Oct 2026 on a local copy: a 15 s collector restart lost 6 % of
# readings with the default and none with the values below.
#
# Merge into the broker's mosquitto.conf, then reload it (kill -HUP <pid> or
# `systemctl reload mosquitto`).

persistence true
persistence_location /var/lib/mosquitto/
# write the in-memory queue to disk every minute (default 1800 s), so a broker
# restart loses at most a minute of what it was holding
autosave_interval 60

# ~17 minutes of collector downtime at 100 msg/s; about 100–150 MB of memory
# when full. Raise it if the collector may be down longer.
max_queued_messages 100000
max_queued_bytes 0

# room for a burst after a network outage
max_inflight_messages 100

# every device and the collector sign in
allow_anonymous false
password_file /etc/mosquitto/passwd
