# Merge with your broker configuration. Keep one collector owner per machine.
# Certificates and device passwords must be provisioned before starting.
listener 8883
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/iot.acl

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60
# Bound BOTH message count and memory during collector downtime.
max_queued_messages 100000
max_queued_bytes 268435456
max_inflight_messages 100
message_size_limit 65536
