name: MQTT Ingest CI

on:
  pull_request:
    branches: [ Gokul ]
  push:
    branches: [ Gokul ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
